# Helyi szintaxispróba: nginx -t -c <projekt>/scripts/nginx-test.conf
# A belépési változót a konténerben a vezerlo-auth.sh állítja elő.
events {}
http {
    map $cookie_vezerlo $vezerlo_ok { default 0; }
    limit_req_zone $binary_remote_addr zone=vezerlo:1m rate=60r/m;
    include /Users/danieltimar/Documents/Vibecode/advent-lupix-site/nginx.conf;
}
