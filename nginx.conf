# Adventi naptár API: mérési események + szerkesztés (IP csak a memóriabeli korláthoz kell, nem naplózzuk)
limit_req_zone $binary_remote_addr zone=kal:1m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    absolute_redirect off;

    location = /vezerlo { return 301 /vezerlo/; }

    location = /api/vezerlo/adat {
        limit_req zone=vezerlo burst=20 nodelay;
        if ($vezerlo_ok = 0) { return 302 /belepes/; }
        proxy_pass http://127.0.0.1:8081/adat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 16k;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/kal/ {
        auth_request /_demo_access;
        error_page 403 =404 /404.html;
        limit_req zone=kal burst=60 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 3m;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /vezerlo/ {
        limit_req zone=vezerlo burst=20 nodelay;
        if ($vezerlo_ok = 0) { return 302 /belepes/; }
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /belepes/ {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # Agu Krisz: élő bemutató-app (Node, 127.0.0.1:8083) a demólink alatt. Admin: /agukrisz-e9faeb/admin/
    location = /agukrisz-e9faeb { return 301 /agukrisz-e9faeb/; }
    location ^~ /agukrisz-e9faeb/ {
        auth_request /_demo_access;
        error_page 403 =404 /404.html;
        limit_req zone=kal burst=60 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Demóoldal és minden alatta lévő asset ugyanazt az élő státuszt ellenőrzi.
    location ~ "^/[a-z0-9][a-z0-9-]*-[0-9a-f]{6}(?:/|$)" {
        auth_request /_demo_access;
        error_page 403 =404 /404.html;
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location = /_demo_access {
        internal;
        proxy_pass http://127.0.0.1:8081/demo-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Demo-URI $request_uri;
        proxy_set_header X-Vezerlo-OK $vezerlo_ok;
    }

    location ~* /assets/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
