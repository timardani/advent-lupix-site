<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adventi vezérlő</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd6;--accent:#9b2c2c;--ok:#166534;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 16px 8px;max-width:1440px;margin:auto}h1{margin:0;font-size:22px}.meta{color:var(--mut);font-size:13px;margin-top:4px}
main{max-width:1440px;margin:auto;padding:0 12px 40px}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.todo h2,.cat h2{margin:0 0 8px;font-size:16px}.todo ul{margin:0;padding-left:18px}.todo li{margin:4px 0}.urg{color:var(--accent);font-weight:650}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.sor{color:var(--mut);font-size:13px;margin:2px 0 8px}
.shop{border-top:1px solid var(--line);padding:13px 0}.shop:first-of-type{border-top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-weight:650;font-size:16px}
.badge,.audit{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:650;white-space:nowrap}.audit.ok{background:var(--ok)}.audit.no{background:var(--accent)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin-top:7px}.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}a{color:#1f4e8c}
.controls{display:grid;grid-template-columns:minmax(155px,1fr) minmax(150px,1fr) minmax(180px,1.25fr);gap:9px;margin-top:11px;padding:10px;background:#faf8f4;border:1px solid var(--line);border-radius:11px}
.control{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.check{flex-direction:row;align-items:center;color:var(--ink);font-size:14px;padding-top:21px}.check input{width:18px;height:18px;margin:0}
input[type=date],input[type=text],select{width:100%;font:inherit;color:var(--ink);padding:7px 8px;border:1px solid #cec6ba;border-radius:8px;background:#fff;min-height:38px}
button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:#faf8f4;cursor:pointer}.tools{display:flex;gap:12px;align-items:center;font-size:14px;margin-top:8px;flex-wrap:wrap}.view-switch{display:flex;gap:3px;padding:3px;background:#e8e3da;border-radius:10px}.view-switch button{border:0;background:transparent;padding:5px 10px}.view-switch button.active{background:#fff;box-shadow:0 1px 3px #0002;font-weight:650}
.done{opacity:.58}.err{color:var(--accent)}#save{min-height:20px}.saving{color:var(--warn)}.saved{color:var(--ok)}
.recovery{max-width:1440px;margin:8px auto 0;padding:11px 14px;background:#fff7ed;border:1px solid #f59e0b;border-radius:11px;color:#7c2d12}.recovery button{margin-left:8px;background:#fff}.recovery strong{display:block;margin-bottom:4px}
.kanban-wrap{overflow-x:auto;padding:3px 0 14px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(235px,1fr));gap:10px;min-width:1215px;align-items:start}.kanban-col{background:#ebe7df;border:1px solid #ddd6ca;border-radius:13px;min-height:280px;padding:9px}.kanban-col.over{background:#ded8cc;outline:2px solid #9b2c2c55}.kanban-head{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 9px;font-weight:700}.count{background:#fff;color:var(--mut);border-radius:999px;min-width:24px;text-align:center;font-size:12px;padding:2px 7px}.kanban-cards{display:flex;flex-direction:column;gap:8px;min-height:220px}.kanban-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:0 1px 3px #0000000d;cursor:grab}.kanban-card.due-soon{border:2px solid #d97706}.kanban-card.overdue{border:2px solid #b91c1c;background:#fffafa}.kanban-card.dragging{opacity:.38}.kanban-card .name{display:block;margin-bottom:2px}.kanban-card .category{color:var(--mut);font-size:12px;margin-bottom:7px}.kanban-card .deadline{font-size:13px;margin:7px 0}.kanban-card .controls{display:flex;flex-direction:column;padding:8px;margin-top:8px}.kanban-card .audit{margin-top:6px}.drag-hint,.column-age{color:var(--mut);font-size:11px;margin-top:8px}.drag-hint{text-align:center}.history{border-top:1px solid var(--line);margin-top:9px;padding-top:7px;font-size:12px}.history summary{cursor:pointer;color:var(--mut)}.history ul{margin:6px 0 0;padding-left:18px}.history li{margin:3px 0}.filter select{min-width:190px;min-height:32px;padding:4px 8px}
@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.control.status{grid-column:1/-1}.dl{grid-template-columns:1fr}.dl dt{margin-top:5px}.check{padding-top:20px}.tools{gap:8px}.kanban{grid-template-columns:repeat(5,82vw);min-width:calc(410vw + 40px)}.kanban-col{scroll-snap-align:start}.kanban-wrap{scroll-snap-type:x mandatory}.kanban-card{cursor:default}}
</style>
</head>
<body>
<header>
 <h1>Adventi vezérlő</h1>
 <div class="meta" id="meta">Betöltés…</div>
 <div class="tools"><div class="view-switch" aria-label="Nézet"><button type="button" id="list-view">Lista</button><button type="button" id="kanban-view">Kanban</button></div><label id="lezart-wrap"><input type="checkbox" id="lezart"> Lezártak mutatása</label><label class="filter" id="filter-wrap" hidden>Kategória <select id="kategoria-szuro"><option value="">Mind</option></select></label><span id="save" aria-live="polite"></span><button type="button" id="logout">Kilépés</button></div>
</header>
<div class="recovery" id="recovery" hidden><strong>Korábbi helyi mentést találtam</strong>A szerver adatai eltérnek a böngészőben megőrzött példánytól. Ez redeploy utáni adatvesztés jele lehet. <button type="button" id="restore-backup">Helyi mentés visszaállítása</button><button type="button" id="dismiss-backup">A szerveradat megtartása</button></div>
<main id="app"></main>
<script>
const S={elokeszites:['Előkészítés','#8a8f98'],review:['Dani review-ra vár','#b7791f'],kuldheto:['Küldhető','#2b6cb0'],tartalek:['Tartalék','#64748b'],kikuldve:['Kiküldve','#6b46c1'],valaszolt:['Válaszolt','#0f766e'],foglalt:['Foglalt (igen)','#15803d'],nyert:['Nyert','#166534'],nem:['Nem kéri','#b91c1c'],nem_reagal:['Nem reagál','#9f1239'],lejart:['Lejárt','#9f1239'],kizart:['Kizárt','#475569']};
const LEZART=new Set(['nem','nem_reagal','lejart','kizart']);
const KANBAN=[
 {id:'kesz',label:'Kész demo',status:'kuldheto',states:new Set(['elokeszites','review','kuldheto','tartalek'])},
 {id:'elkuldve',label:'Elküldve',status:'kikuldve',states:new Set(['kikuldve'])},
 {id:'masodik',label:'Második keresés',status:'nem_reagal',states:new Set(['nem_reagal','lejart'])},
 {id:'erdekli',label:'Érdekli',status:'valaszolt',states:new Set(['valaszolt','foglalt','nyert'])},
 {id:'off',label:'OFF',status:'nem',states:new Set(['nem','kizart'])}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ma=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Budapest'}).format(new Date());
const nap=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const hu=d=>d?d.slice(5,10).replace('-','.')+'.':'';
const datumido=value=>{if(!value)return '—';const d=new Date(value);return Number.isNaN(d.valueOf())?esc(value):new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Budapest'}).format(d)};
const BACKUP_KEY='vezerlo-adat-backup-v1';
let adat,linkek={},audit={demok:{}},view=localStorage.getItem('vezerlo-view')==='kanban'?'kanban':'list',dragId='',pendingBackup=null;
function badge(a){const[t,c]=S[a]||[a,'#888'];return `<span class="badge" style="background:${c}">${esc(t)}</span>`}
function options(selected){return Object.entries(S).map(([v,[label]])=>`<option value="${v}"${v===selected?' selected':''}>${esc(label)}</option>`).join('')}
function hatSzoveg(b){if(!b.hatarido)return '';const d=nap(b.hatarido,ma);return d<0?`<span class="urg">${hu(b.hatarido)} – lejárt (${-d} napja)</span>`:d===0?`<span class="urg">${hu(b.hatarido)} – ma jár le</span>`:`${hu(b.hatarido)} – még ${d} nap`}
function deadlineClass(b){if(!b.hatarido||!['kikuldve','nem_reagal'].includes(b.allapot))return '';const d=nap(b.hatarido,ma);return d<0?' overdue':d<=1?' due-soon':''}
function statusAge(b){const start=b.allapot_datum||(b.allapot==='kikuldve'?b.kikuldve:['valaszolt','foglalt','nyert','nem'].includes(b.allapot)?b.valasz_datum:'');if(!start)return 'Oszlopban töltött idő: még nincs adat';const days=Math.max(0,nap(ma,start.slice(0,10)));return `Oszlopban: ${days} napja`}
function historyHtml(b){const history=Array.isArray(b.elozmenyek)?b.elozmenyek:[];if(!history.length)return '<details class="history"><summary>Előzmények (0)</summary><div class="meta">Még nincs rögzített státuszváltás.</div></details>';return `<details class="history"><summary>Előzmények (${history.length})</summary><ul>${history.slice(-8).reverse().map(x=>`<li>${datumido(x.datum)}: ${esc(S[x.innen]?.[0]||x.innen||'—')} → <b>${esc(S[x.ide]?.[0]||x.ide)}</b></li>`).join('')}</ul></details>`}
function teendok(){const t=[];for(const b of adat.boltok){const d=b.hatarido?nap(b.hatarido,ma):null;
 if(b.allapot==='kikuldve'&&d!==null&&d<0)t.push([0,`<span class="urg">${esc(b.bolt)}</span>: lejárt a határidő → jelöld „Nem reagál”-ra`]);
 else if(b.allapot==='kikuldve'&&d===0)t.push([1,`<span class="urg">${esc(b.bolt)}</span>: ma jár le a határidő`]);
 else if(b.allapot==='kikuldve'&&d===1)t.push([2,`${esc(b.bolt)}: holnap jár le a határidő`]);
 else if(b.allapot==='valaszolt')t.push([1,`${esc(b.bolt)}: válaszolt → vidd tovább${b.megjegyzes?' ('+esc(b.megjegyzes)+')':''}`]);
 else if(b.allapot==='kuldheto')t.push([3,`${esc(b.bolt)}: mehet a levél`]);}return t.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function renderList(){const mutat=document.getElementById('lezart').checked;const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null;
 document.getElementById('meta').innerHTML=`Ma: ${hu(ma)} · státuszok frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírási határidő ${hu(adat.alairasi_hatarido)}: <b>${ah} nap</b>`:''}`;
 const td=teendok();let h=`<section class="box todo"><h2>Mi a teendő ma?</h2>${td.length?'<ul>'+td.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<div class="meta">Nincs sürgős teendő.</div>'}</section>`;
 for(const k of adat.kategoriak){const bb=adat.boltok.filter(b=>b.kategoria===k.nev);const lat=bb.filter(b=>mutat||!LEZART.has(b.allapot));const al=bb.some(b=>b.allapot==='nyert')?'nyert':bb.some(b=>b.allapot==='foglalt')?'foglalt':bb.some(b=>['kikuldve','valaszolt'].includes(b.allapot))?'kikuldve':null;
  h+=`<section class="box cat"><div class="cat-head"><h2>${esc(k.nev)}</h2>${al?badge(al):'<span class="meta">szabad</span>'}</div>${k.sor?`<div class="sor">Sorban: ${esc(k.sor)}</div>`:''}`;
  for(const b of lat){const sl=linkek[b.demo],url=sl?`${location.origin}/${sl}/?bemutato=1`:'',a=audit.demok?.[b.demo];const title=a?.hianyok?.join('; ')||'';
   h+=`<div class="shop${LEZART.has(b.allapot)?' done':''}"><div class="row"><span class="name">${esc(b.bolt)}</span>${badge(b.allapot)}${b.demo?(a?`<span class="audit ${a.demo2_kesz?'ok':'no'}" title="${esc(title)}">2. demó: ${a.demo2_kesz?'kész':'nincs kész'}</span>`:'<span class="audit no">2. demó: nincs adat</span>'):''}</div><dl class="dl">`+
   (b.kinek||b.email?`<dt>Kinek</dt><dd>${esc(b.kinek)}${b.email?`${b.kinek?' · ':''}<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:''}</dd>`:'')+
   (url?`<dt>Demó</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(location.origin,''))}</a> <button data-copy="${esc(url)}">Másolás</button></dd>`:(b.demo?`<dt>Demó</dt><dd class="meta">még nincs kint (kiad.py --uj ${esc(b.demo)})</dd>`:''))+
   (a?`<dt>Kalendárium frissítve</dt><dd>${datumido(a.frissitve)}</dd>`:'')+
   (b.kikuldve?`<dt>Kiküldés dátuma</dt><dd>${hu(b.kikuldve)}</dd>`:'')+(b.hatarido?`<dt>Határidő állapota</dt><dd>${hatSzoveg(b)}</dd>`:'')+
   (b.teendo?`<dt>Teendő</dt><dd>${esc(b.teendo)}</dd>`:'')+(b.megjegyzes?`<dt>Megjegyzés</dt><dd>${esc(b.megjegyzes)}</dd>`:'')+`</dl>
   <div class="controls"><label class="control check"><input type="checkbox" data-id="${esc(b.id)}" data-field="kikuldve"${b.kikuldve?' checked':''}> Kiküldtem</label><label class="control">Határidő<input type="date" data-id="${esc(b.id)}" data-field="hatarido" value="${esc(b.hatarido)}"></label><label class="control status">Státusz<select data-id="${esc(b.id)}" data-field="allapot">${options(b.allapot)}</select></label></div></div>`}
  if(!lat.length)h+='<div class="meta">Nincs aktív bolt.</div>';h+='</section>'}
 document.getElementById('app').innerHTML=h}
function kanbanCard(b){const a=audit.demok?.[b.demo];return `<article class="kanban-card${deadlineClass(b)}" draggable="true" data-drag-id="${esc(b.id)}"><span class="name">${esc(b.bolt)}</span><div class="category">${esc(b.kategoria)}</div>${badge(b.allapot)}${a?`<br><span class="audit ${a.demo2_kesz?'ok':'no'}">2. demó: ${a.demo2_kesz?'kész':'nincs kész'}</span>`:''}<div class="column-age">${statusAge(b)}</div><div class="deadline">${b.hatarido?hatSzoveg(b):'<span class="meta">Nincs határidő</span>'}</div><div class="controls"><label class="control">Következő teendő<input type="text" maxlength="500" data-id="${esc(b.id)}" data-field="teendo" value="${esc(b.teendo)}" placeholder="Pl. telefonálni pénteken"></label><label class="control">Határidő<input type="date" data-id="${esc(b.id)}" data-field="hatarido" value="${esc(b.hatarido)}"></label><label class="control status">Státusz<select data-id="${esc(b.id)}" data-field="allapot">${options(b.allapot)}</select></label></div>${historyHtml(b)}<div class="drag-hint">Fogd meg és húzd másik oszlopba</div></article>`}
function renderKanban(){const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null,filter=document.getElementById('kategoria-szuro').value;document.getElementById('meta').innerHTML=`Ma: ${hu(ma)} · státuszok frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírási határidő ${hu(adat.alairasi_hatarido)}: <b>${ah} nap</b>`:''}`;let h='<div class="kanban-wrap"><div class="kanban">';for(const col of KANBAN){const bb=adat.boltok.filter(b=>col.states.has(b.allapot)&&(!filter||b.kategoria===filter));h+=`<section class="kanban-col" data-drop-status="${col.status}"><div class="kanban-head"><span>${col.label}</span><span class="count">${bb.length}</span></div><div class="kanban-cards">${bb.map(kanbanCard).join('')}</div></section>`}h+='</div></div>';document.getElementById('app').innerHTML=h}
function render(){document.getElementById('list-view').classList.toggle('active',view==='list');document.getElementById('kanban-view').classList.toggle('active',view==='kanban');document.getElementById('lezart-wrap').hidden=view==='kanban';document.getElementById('filter-wrap').hidden=view!=='kanban';view==='kanban'?renderKanban():renderList()}
function fillCategoryFilter(){const select=document.getElementById('kategoria-szuro'),saved=localStorage.getItem('vezerlo-kategoria')||'';select.innerHTML='<option value="">Mind</option>'+adat.kategoriak.map(k=>`<option value="${esc(k.nev)}">${esc(k.nev)}</option>`).join('');select.value=[...select.options].some(x=>x.value===saved)?saved:''}
function setView(next){view=next;localStorage.setItem('vezerlo-view',view);render()}
function tracked(data){return JSON.stringify((data?.boltok||[]).map(b=>[b.id,b.allapot,b.kikuldve||'',b.hatarido||'',b.teendo||'']))}
function backup(data){localStorage.setItem(BACKUP_KEY,JSON.stringify({mentve:new Date().toISOString(),adat:data}))}
function checkBackup(server){try{const saved=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');if(saved?.adat&&tracked(saved.adat)!==tracked(server)){pendingBackup=saved;document.getElementById('recovery').hidden=false}else backup(server)}catch{backup(server)}}
async function restoreBackup(){if(!pendingBackup)return;const out=document.getElementById('save'),button=document.getElementById('restore-backup');button.disabled=true;out.className='saving';out.textContent='Helyi mentés visszaállítása…';try{for(const old of pendingBackup.adat.boltok||[]){const current=adat.boltok.find(b=>b.id===old.id);if(!current||tracked({boltok:[current]})===tracked({boltok:[old]}))continue;const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:old.id,allapot:old.allapot,kikuldve:old.kikuldve||'',hatarido:old.hatarido||'',teendo:old.teendo||''})});const j=await r.json();if(!r.ok)throw new Error(j.hiba||`Nem állítható vissza: ${old.bolt}`);adat=j}pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat);render();out.className='saved';out.textContent='Helyi mentés visszaállítva ✓'}catch(e){out.className='err';out.textContent=e.message}finally{button.disabled=false}}
async function save(id,changes){const out=document.getElementById('save');out.className='saving';out.textContent='Mentés…';document.querySelectorAll('[data-field]').forEach(x=>x.disabled=true);
 try{const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...changes})});if(r.redirected){location.href='/belepes/';return}const j=await r.json();if(!r.ok)throw new Error(j.hiba||'Mentési hiba');adat=j;if(!pendingBackup)backup(adat);render();out.className='saved';out.textContent='Mentve ✓';setTimeout(()=>out.textContent='',1800)}catch(e){out.className='err';out.textContent=e.message;render()}finally{document.querySelectorAll('[data-field]').forEach(x=>x.disabled=false)}}
document.addEventListener('click',e=>{const u=e.target.dataset?.copy;if(u)navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Másolva';setTimeout(()=>e.target.textContent='Másolás',1500)})});
document.addEventListener('change',e=>{const {id,field}=e.target.dataset||{};if(!id||!field)return;save(id,{[field]:field==='kikuldve'?e.target.checked:e.target.value})});
document.addEventListener('dragstart',e=>{const card=e.target.closest?.('[data-drag-id]');if(!card)return;dragId=card.dataset.dragId;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',e=>{e.target.closest?.('[data-drag-id]')?.classList.remove('dragging');document.querySelectorAll('.kanban-col').forEach(x=>x.classList.remove('over'));dragId=''});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-drop-status]');if(!col)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.kanban-col').forEach(x=>x.classList.toggle('over',x===col))});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-drop-status]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-drop-status]');if(!col)return;e.preventDefault();const id=dragId||e.dataTransfer.getData('text/plain');document.querySelectorAll('.kanban-col').forEach(x=>x.classList.remove('over'));const bolt=adat.boltok.find(b=>b.id===id);if(id&&bolt&&bolt.allapot!==col.dataset.dropStatus)save(id,{allapot:col.dataset.dropStatus})});
document.getElementById('list-view').addEventListener('click',()=>setView('list'));document.getElementById('kanban-view').addEventListener('click',()=>setView('kanban'));document.getElementById('lezart').addEventListener('change',render);document.getElementById('kategoria-szuro').addEventListener('change',e=>{localStorage.setItem('vezerlo-kategoria',e.target.value);render()});document.getElementById('logout').addEventListener('click',()=>{document.cookie='vezerlo=; Path=/; Max-Age=0';location.href='/belepes/'});
document.getElementById('restore-backup').addEventListener('click',restoreBackup);document.getElementById('dismiss-backup').addEventListener('click',()=>{pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat)});
Promise.all([fetch('/api/vezerlo/adat',{cache:'no-store'}).then(r=>{if(!r.ok||r.redirected){location.href='/belepes/';throw new Error('Nincs belépve')}return r.json()}),fetch('kiadas.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:[]}).catch(()=>({demok:[]})),fetch('demo-audit.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:{}}).catch(()=>({demok:{}}))])
 .then(([a,k,d])=>{adat=a;audit=d;for(const x of k.demok)linkek[x.demo]=x.slug;checkBackup(adat);fillCategoryFilter();render()}).catch(e=>{document.getElementById('app').innerHTML=`<p class="err">Nem sikerült betölteni: ${esc(e.message)}</p>`});
</script>
</body>
</html>
