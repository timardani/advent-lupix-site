<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adventi vezérlő</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd6;--accent:#9b2c2c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 16px 8px;max-width:960px;margin:auto}
h1{margin:0;font-size:22px}
.meta{color:var(--mut);font-size:13px;margin-top:4px}
main{max-width:960px;margin:auto;padding:0 12px 40px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.todo h2,.cat h2{margin:0 0 8px;font-size:16px}
.todo ul{margin:0;padding-left:18px}.todo li{margin:4px 0}
.urg{color:var(--accent);font-weight:600}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sor{color:var(--mut);font-size:13px;margin:2px 0 8px}
.shop{border-top:1px solid var(--line);padding:10px 0}
.shop:first-of-type{border-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:650;font-size:16px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin-top:6px}
.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}
a{color:#1f4e8c}
button{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:#faf8f4;cursor:pointer}
.tools{display:flex;gap:12px;align-items:center;font-size:14px;margin-top:8px;flex-wrap:wrap}
.done{opacity:.55}
.err{color:var(--accent)}
</style>
</head>
<body>
<header>
 <h1>Adventi vezérlő</h1>
 <div class="meta" id="meta">Betöltés…</div>
 <div class="tools"><label><input type="checkbox" id="lezart"> Lezártak mutatása</label></div>
</header>
<main id="app"></main>
<script>
const S={elokeszites:['Előkészítés','#8a8f98'],review:['Dani review-ra vár','#b7791f'],kuldheto:['Küldhető','#2b6cb0'],tartalek:['Tartalék','#64748b'],kikuldve:['Kiküldve – várunk','#6b46c1'],valaszolt:['Válaszolt','#0f766e'],foglalt:['Foglalt (igen)','#15803d'],nyert:['Nyert','#166534'],nem:['Nemet mondott','#b91c1c'],lejart:['Lejárt','#9f1239'],kizart:['Kizárt','#475569']};
const LEZART=new Set(['nem','lejart','kizart']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ma=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Budapest'}).format(new Date());
const nap=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const hu=d=>d?d.slice(5).replace('-','.')+'.':'';
let adat,linkek={};
function badge(a){const[t,c]=S[a]||[a,'#888'];return `<span class="badge" style="background:${c}">${esc(t)}</span>`}
function hatSzoveg(b){if(b.allapot!=='kikuldve'||!b.hatarido)return hu(b.hatarido);const d=nap(b.hatarido,ma);
 return d<0?`<span class="urg">${hu(b.hatarido)} – lejárt (${-d} napja)</span>`:d===0?`<span class="urg">${hu(b.hatarido)} – ma jár le</span>`:`${hu(b.hatarido)} – még ${d} nap`}
function teendok(){const t=[];
 for(const b of adat.boltok){const d=b.hatarido?nap(b.hatarido,ma):null;
  if(b.allapot==='kikuldve'&&d!==null&&d<0)t.push([0,`<span class="urg">${esc(b.bolt)}</span>: lejárt a határidő → jelöld lejártnak, jöhet a következő bolt (${esc(b.kategoria)})`]);
  else if(b.allapot==='kikuldve'&&d===0)t.push([1,`<span class="urg">${esc(b.bolt)}</span>: ma jár le a határidő`]);
  else if(b.allapot==='kikuldve'&&d===1)t.push([2,`${esc(b.bolt)}: holnap jár le a határidő`]);
  else if(b.allapot==='valaszolt')t.push([1,`${esc(b.bolt)}: válaszolt → vidd tovább${b.megjegyzes?' ('+esc(b.megjegyzes)+')':''}`]);
  else if(b.allapot==='foglalt'){const k=b.valasz_datum?nap(ma,b.valasz_datum):0;t.push([k>7?0:2,`${esc(b.bolt)}: foglalt → szerződés/fizetés${k>7?' <span class="urg">(több mint 5 munkanapja)</span>':''}`])}
  else if(b.allapot==='kuldheto')t.push([3,`${esc(b.bolt)}: mehet a levél`]);}
 return t.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function render(){const mutat=document.getElementById('lezart').checked;
 const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null;
 document.getElementById('meta').innerHTML=`Ma: ${hu(ma)} · adat frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírási határidő ${hu(adat.alairasi_hatarido)}: <b>${ah} nap</b>`:''}`;
 const td=teendok();
 let h=`<section class="box todo"><h2>Mi a teendő ma?</h2>${td.length?'<ul>'+td.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<div class="meta">Nincs sürgős teendő.</div>'}</section>`;
 for(const k of adat.kategoriak){const bb=adat.boltok.filter(b=>b.kategoria===k.nev);const lat=bb.filter(b=>mutat||!LEZART.has(b.allapot));
  const al=bb.some(b=>b.allapot==='nyert')?'nyert':bb.some(b=>b.allapot==='foglalt')?'foglalt':bb.some(b=>['kikuldve','valaszolt'].includes(b.allapot))?'kikuldve':null;
  h+=`<section class="box cat"><div class="cat-head"><h2>${esc(k.nev)}</h2>${al?badge(al):'<span class="meta">szabad</span>'}</div>${k.sor?`<div class="sor">Sorban: ${esc(k.sor)}</div>`:''}`;
  for(const b of lat){const sl=linkek[b.demo];const url=sl?`${location.origin}/${sl}/?bemutato=1`:'';
   h+=`<div class="shop${LEZART.has(b.allapot)?' done':''}"><div class="row"><span class="name">${esc(b.bolt)}</span>${badge(b.allapot)}</div><dl class="dl">`+
   (b.kinek||b.email?`<dt>Kinek</dt><dd>${esc(b.kinek)}${b.email?`${b.kinek?' · ':''}<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:''}</dd>`:'')+
   (url?`<dt>Demó</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(location.origin,''))}</a> <button data-copy="${esc(url)}">Másolás</button></dd>`:(b.demo?`<dt>Demó</dt><dd class="meta">még nincs kint (kiad.py --uj ${esc(b.demo)})</dd>`:''))+
   (b.kikuldve?`<dt>Kiküldve</dt><dd>${hu(b.kikuldve)}</dd>`:'')+
   (b.hatarido?`<dt>Határidő</dt><dd>${hatSzoveg(b)}</dd>`:'')+
   (b.valasz_datum?`<dt>Válasz</dt><dd>${hu(b.valasz_datum)}</dd>`:'')+
   (b.teendo?`<dt>Teendő</dt><dd>${esc(b.teendo)}</dd>`:'')+
   (b.megjegyzes?`<dt>Megjegyzés</dt><dd>${esc(b.megjegyzes)}</dd>`:'')+`</dl></div>`}
  if(!lat.length)h+='<div class="meta">Nincs aktív bolt.</div>';
  h+='</section>'}
 document.getElementById('app').innerHTML=h}
document.addEventListener('click',e=>{const u=e.target.dataset?.copy;if(u){navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Másolva';setTimeout(()=>e.target.textContent='Másolás',1500)})}});
document.getElementById('lezart').addEventListener('change',render);
Promise.all([fetch('adat.json',{cache:'no-store'}).then(r=>r.json()),fetch('kiadas.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:[]}).catch(()=>({demok:[]}))])
 .then(([a,k])=>{adat=a;for(const d of k.demok)linkek[d.demo]=d.slug;render()})
 .catch(e=>{document.getElementById('app').innerHTML=`<p class="err">Nem sikerült betölteni: ${esc(e.message)}</p>`});
</script>
</body>
</html>
