<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adventi vezérlő</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd6;--accent:#9b2c2c;--ok:#166534;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 16px 8px;max-width:1040px;margin:auto}h1{margin:0;font-size:22px}.meta{color:var(--mut);font-size:13px;margin-top:4px}
main{max-width:1040px;margin:auto;padding:0 12px 40px}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.todo h2,.cat h2{margin:0 0 8px;font-size:16px}.todo ul{margin:0;padding-left:18px}.todo li{margin:4px 0}.urg{color:var(--accent);font-weight:650}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.sor{color:var(--mut);font-size:13px;margin:2px 0 8px}
.shop{border-top:1px solid var(--line);padding:13px 0}.shop:first-of-type{border-top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-weight:650;font-size:16px}
.badge,.audit{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:650;white-space:nowrap}.audit.ok{background:var(--ok)}.audit.no{background:var(--accent)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin-top:7px}.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}a{color:#1f4e8c}
.controls{display:grid;grid-template-columns:minmax(155px,1fr) minmax(150px,1fr) minmax(180px,1.25fr);gap:9px;margin-top:11px;padding:10px;background:#faf8f4;border:1px solid var(--line);border-radius:11px}
.control{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.check{flex-direction:row;align-items:center;color:var(--ink);font-size:14px;padding-top:21px}.check input{width:18px;height:18px;margin:0}
input[type=date],select{width:100%;font:inherit;color:var(--ink);padding:7px 8px;border:1px solid #cec6ba;border-radius:8px;background:#fff;min-height:38px}
button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:#faf8f4;cursor:pointer}.tools{display:flex;gap:12px;align-items:center;font-size:14px;margin-top:8px;flex-wrap:wrap}
.done{opacity:.58}.err{color:var(--accent)}#save{min-height:20px}.saving{color:var(--warn)}.saved{color:var(--ok)}
@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.control.status{grid-column:1/-1}.dl{grid-template-columns:1fr}.dl dt{margin-top:5px}.check{padding-top:20px}}
</style>
</head>
<body>
<header>
 <h1>Adventi vezérlő</h1>
 <div class="meta" id="meta">Betöltés…</div>
 <div class="tools"><label><input type="checkbox" id="lezart"> Lezártak mutatása</label><span id="save" aria-live="polite"></span><button type="button" id="logout">Kilépés</button></div>
</header>
<main id="app"></main>
<script>
const S={elokeszites:['Előkészítés','#8a8f98'],review:['Dani review-ra vár','#b7791f'],kuldheto:['Küldhető','#2b6cb0'],tartalek:['Tartalék','#64748b'],kikuldve:['Kiküldve','#6b46c1'],valaszolt:['Válaszolt','#0f766e'],foglalt:['Foglalt (igen)','#15803d'],nyert:['Nyert','#166534'],nem:['Nem kéri','#b91c1c'],nem_reagal:['Nem reagál','#9f1239'],lejart:['Lejárt','#9f1239'],kizart:['Kizárt','#475569']};
const LEZART=new Set(['nem','nem_reagal','lejart','kizart']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ma=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Budapest'}).format(new Date());
const nap=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const hu=d=>d?d.slice(5,10).replace('-','.')+'.':'';
const datumido=value=>{if(!value)return '—';const d=new Date(value);return Number.isNaN(d.valueOf())?esc(value):new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Budapest'}).format(d)};
let adat,linkek={},audit={demok:{}};
function badge(a){const[t,c]=S[a]||[a,'#888'];return `<span class="badge" style="background:${c}">${esc(t)}</span>`}
function options(selected){return Object.entries(S).map(([v,[label]])=>`<option value="${v}"${v===selected?' selected':''}>${esc(label)}</option>`).join('')}
function hatSzoveg(b){if(!b.hatarido)return '';const d=nap(b.hatarido,ma);return d<0?`<span class="urg">${hu(b.hatarido)} – lejárt (${-d} napja)</span>`:d===0?`<span class="urg">${hu(b.hatarido)} – ma jár le</span>`:`${hu(b.hatarido)} – még ${d} nap`}
function teendok(){const t=[];for(const b of adat.boltok){const d=b.hatarido?nap(b.hatarido,ma):null;
 if(b.allapot==='kikuldve'&&d!==null&&d<0)t.push([0,`<span class="urg">${esc(b.bolt)}</span>: lejárt a határidő → jelöld „Nem reagál”-ra`]);
 else if(b.allapot==='kikuldve'&&d===0)t.push([1,`<span class="urg">${esc(b.bolt)}</span>: ma jár le a határidő`]);
 else if(b.allapot==='kikuldve'&&d===1)t.push([2,`${esc(b.bolt)}: holnap jár le a határidő`]);
 else if(b.allapot==='valaszolt')t.push([1,`${esc(b.bolt)}: válaszolt → vidd tovább${b.megjegyzes?' ('+esc(b.megjegyzes)+')':''}`]);
 else if(b.allapot==='kuldheto')t.push([3,`${esc(b.bolt)}: mehet a levél`]);}return t.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function render(){const mutat=document.getElementById('lezart').checked;const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null;
 document.getElementById('meta').innerHTML=`Ma: ${hu(ma)} · státuszok frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírási határidő ${hu(adat.alairasi_hatarido)}: <b>${ah} nap</b>`:''}`;
 const td=teendok();let h=`<section class="box todo"><h2>Mi a teendő ma?</h2>${td.length?'<ul>'+td.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<div class="meta">Nincs sürgős teendő.</div>'}</section>`;
 for(const k of adat.kategoriak){const bb=adat.boltok.filter(b=>b.kategoria===k.nev);const lat=bb.filter(b=>mutat||!LEZART.has(b.allapot));const al=bb.some(b=>b.allapot==='nyert')?'nyert':bb.some(b=>b.allapot==='foglalt')?'foglalt':bb.some(b=>['kikuldve','valaszolt'].includes(b.allapot))?'kikuldve':null;
  h+=`<section class="box cat"><div class="cat-head"><h2>${esc(k.nev)}</h2>${al?badge(al):'<span class="meta">szabad</span>'}</div>${k.sor?`<div class="sor">Sorban: ${esc(k.sor)}</div>`:''}`;
  for(const b of lat){const sl=linkek[b.demo],url=sl?`${location.origin}/${sl}/?bemutato=1`:'',a=audit.demok?.[b.demo];const title=a?.hianyok?.join('; ')||'';
   h+=`<div class="shop${LEZART.has(b.allapot)?' done':''}"><div class="row"><span class="name">${esc(b.bolt)}</span>${badge(b.allapot)}${b.demo?(a?`<span class="audit ${a.demo2_kesz?'ok':'no'}" title="${esc(title)}">2. demó: ${a.demo2_kesz?'kész':'nincs kész'}</span>`:'<span class="audit no">2. demó: nincs adat</span>'):''}</div><dl class="dl">`+
   (b.kinek||b.email?`<dt>Kinek</dt><dd>${esc(b.kinek)}${b.email?`${b.kinek?' · ':''}<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:''}</dd>`:'')+
   (url?`<dt>Demó</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(location.origin,''))}</a> <button data-copy="${esc(url)}">Másolás</button></dd>`:(b.demo?`<dt>Demó</dt><dd class="meta">még nincs kint (kiad.py --uj ${esc(b.demo)})</dd>`:''))+
   (a?`<dt>Kalendárium frissítve</dt><dd>${datumido(a.frissitve)}</dd>`:'')+
   (b.kikuldve?`<dt>Kiküldés dátuma</dt><dd>${hu(b.kikuldve)}</dd>`:'')+(b.hatarido?`<dt>Határidő állapota</dt><dd>${hatSzoveg(b)}</dd>`:'')+
   (b.teendo?`<dt>Teendő</dt><dd>${esc(b.teendo)}</dd>`:'')+(b.megjegyzes?`<dt>Megjegyzés</dt><dd>${esc(b.megjegyzes)}</dd>`:'')+`</dl>
   <div class="controls"><label class="control check"><input type="checkbox" data-id="${esc(b.id)}" data-field="kikuldve"${b.kikuldve?' checked':''}> Kiküldtem</label><label class="control">Határidő<input type="date" data-id="${esc(b.id)}" data-field="hatarido" value="${esc(b.hatarido)}"></label><label class="control status">Státusz<select data-id="${esc(b.id)}" data-field="allapot">${options(b.allapot)}</select></label></div></div>`}
  if(!lat.length)h+='<div class="meta">Nincs aktív bolt.</div>';h+='</section>'}
 document.getElementById('app').innerHTML=h}
async function save(id,changes){const out=document.getElementById('save');out.className='saving';out.textContent='Mentés…';document.querySelectorAll('[data-field]').forEach(x=>x.disabled=true);
 try{const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...changes})});if(r.redirected){location.href='/belepes/';return}const j=await r.json();if(!r.ok)throw new Error(j.hiba||'Mentési hiba');adat=j;render();out.className='saved';out.textContent='Mentve ✓';setTimeout(()=>out.textContent='',1800)}catch(e){out.className='err';out.textContent=e.message;render()}finally{document.querySelectorAll('[data-field]').forEach(x=>x.disabled=false)}}
document.addEventListener('click',e=>{const u=e.target.dataset?.copy;if(u)navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Másolva';setTimeout(()=>e.target.textContent='Másolás',1500)})});
document.addEventListener('change',e=>{const {id,field}=e.target.dataset||{};if(!id||!field)return;save(id,{[field]:field==='kikuldve'?e.target.checked:e.target.value})});
document.getElementById('lezart').addEventListener('change',render);document.getElementById('logout').addEventListener('click',()=>{document.cookie='vezerlo=; Path=/; Max-Age=0';location.href='/belepes/'});
Promise.all([fetch('/api/vezerlo/adat',{cache:'no-store'}).then(r=>{if(!r.ok||r.redirected){location.href='/belepes/';throw new Error('Nincs belépve')}return r.json()}),fetch('kiadas.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:[]}).catch(()=>({demok:[]})),fetch('demo-audit.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:{}}).catch(()=>({demok:{}}))])
 .then(([a,k,d])=>{adat=a;audit=d;for(const x of k.demok)linkek[x.demo]=x.slug;render()}).catch(e=>{document.getElementById('app').innerHTML=`<p class="err">Nem sikerült betölteni: ${esc(e.message)}</p>`});
</script>
</body>
</html>
