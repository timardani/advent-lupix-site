<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd6;--accent:#9b2c2c;--ok:#166534;--warn:#b45309;--blue:#1f4e8c}

.tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.view-switch{display:flex;gap:3px;padding:3px;background:#e8e3da;border-radius:9px}.view-switch button,.plain-button{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#faf8f4;cursor:pointer}.view-switch button{border:0;background:transparent}.view-switch button.active{background:#fff;box-shadow:0 1px 3px #0002;font-weight:700}.save{min-height:18px}.saving{color:var(--warn)}.saved{color:var(--ok)}.err,.urg{color:var(--accent)}.urg{font-weight:700}

.cat{margin:10px 0}.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 3px}.cat-head h2{font-size:15px;margin:0}.queue{color:var(--mut);font-size:11px;margin:2px 3px 7px}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:7px}.shop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}.shop.done{opacity:.62}.shop.done .name{text-decoration:line-through}.shop-top{display:flex;align-items:center;gap:6px;min-width:0}.name{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge,.flag{display:inline-block;border-radius:999px;padding:2px 7px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}.shop-top .badge{margin-left:auto}.mini{display:flex;gap:5px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:5px}.mini .missing{color:#9f1239;background:#fff1f2;border-radius:999px;padding:1px 6px}.mini .live{color:var(--ok)}

.empty{background:#ffffff80;border:1px dashed #d7d0c5;border-radius:9px;padding:9px;color:var(--mut);font-size:12px}.recovery{max-width:1416px;margin:7px auto;padding:10px 12px;background:#fff7ed;border:1px solid #f59e0b;border-radius:10px;color:#7c2d12}.recovery strong{display:block}.recovery button{margin:5px 5px 0 0}
.kanban-wrap{overflow-x:auto;padding-bottom:10px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:8px;min-width:940px;align-items:start}.kanban-col{background:#ebe7df;border:1px solid #ddd6ca;border-radius:11px;padding:8px;min-height:180px}.kanban-head{display:flex;justify-content:space-between;font-weight:700;padding:1px 2px 7px}.count{background:#fff;color:var(--mut);border-radius:999px;min-width:22px;text-align:center;font-size:11px;padding:1px 6px}.kanban-cards{display:flex;flex-direction:column;gap:5px}.kanban-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:700;font-size:13px;overflow-wrap:anywhere}.kanban-note{color:var(--mut);font-size:11px;margin:0 0 8px}

.kc-name{font-weight:750;font-size:13px}.kc-cat{color:var(--mut);font-size:11px;font-weight:400}.kc-why{font-size:11px;font-weight:600;color:var(--mut)}.kc-why.urg{color:var(--accent)}.kc-why.warn{color:var(--warn)}.kc-why.ok{color:var(--ok)}.kc-miss{font-size:10px;color:#9f1239;font-weight:500}
.col-most{background:#fdeaea;border-color:#f3c4c4}.col-ido{background:#fdf6e3;border-color:#f0dca8}.kanban-empty{color:var(--mut);font-size:12px;padding:6px}
.tg{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:5px 0}.tg>b{font-size:12px;min-width:140px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}.chip:hover{border-color:var(--blue)}.chip.urg{border-color:#f0b4b4;color:var(--accent);font-weight:700}.chip.warn{border-color:#f5d08a}.chip small{color:var(--mut);font-weight:400}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(480px,100vw);max-width:100vw;border:0;border-left:1px solid var(--line);padding:0;background:var(--bg);color:var(--ink)}dialog.drawer::backdrop{background:#0007}
.drawer-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}.drawer-head strong{font-size:16px}#drawer-body{padding:10px 12px 40px}.why{font-weight:700;margin:2px 0 10px;font-size:13px}.why.urg{color:var(--accent)}.why.warn{color:var(--warn)}.why.ok{color:var(--ok)}
html[data-theme=dark] .jump{background:#111114;border-color:#34343c}html[data-theme=dark] .col-most{background:#2a1214;border-color:#4a1d20}html[data-theme=dark] .col-ido{background:#221b0c;border-color:#4a3a14}
@media(max-width:700px){.kanban{grid-template-columns:repeat(var(--cols,6),82vw);min-width:calc(var(--cols,6) * 82vw + 40px)}.kanban-cards{max-height:none}.jump{min-width:0;flex:1 1 100%}.tg>b{min-width:0;flex:1 1 100%}}

<body>
<header>
 <h1>Adventi vezérlő</h1>
 <div class="meta" id="meta">Betöltés…</div>
 <div class="tools"><input class="jump" id="ugras" type="search" list="boltlista" autocomplete="off" placeholder="🔎 Ugrás boltra… (⌘K)" aria-label="Ugrás boltra"><datalist id="boltlista"></datalist><div class="view-switch" aria-label="Nézet"><button type="button" id="kanban-view">Teendő tábla</button><button type="button" id="list-view">Lista</button></div><label id="lezart-wrap"><input type="checkbox" id="lezart" checked> Lezártak is</label><span class="save" id="save" aria-live="polite"></span><a class="plain-button" href="kategoriak.html">Kategóriák és jelöltek →</a><a class="plain-button" href="tokenek.html">Tokenmérés →</a><button type="button" class="plain-button theme-btn" id="tema" aria-pressed="false">🌙 Éjszakai</button><button type="button" class="plain-button" id="logout">Kilépés</button></div>
</header>
<div class="recovery" id="recovery" hidden><strong>Korábbi helyi mentést találtam</strong>A szerver adatai eltérnek a böngészőben megőrzött példánytól. Ez redeploy utáni adatvesztés jele lehet.<br><button type="button" class="plain-button" id="restore-backup">Helyi mentés visszaállítása</button><button type="button" class="plain-button" id="dismiss-backup">A szerveradat megtartása</button></div>
<main id="app"></main>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><strong id="drawer-title"></strong><button type="button" class="plain-button" id="drawer-close">✕ Bezárás</button></div><div id="drawer-body"></div></dialog>
<script>
const S={keszul:['Készül','#8a8f98'],kuldheto:['Küldhető','#2b6cb0'],kikuldve:['Kiküldve','#6b46c1'],idot_kert:['Időt kért','#b7791f'],nyert:['Nyert','#15803d'],lezart:['Lezárt','#475569']};
// Régi (12 státuszos) értékek: az új 5 státusz alá soroljuk, a régi jelentés címkeként marad.
const ALIAS={elokeszites:'keszul',review:'keszul',tartalek:'kuldheto',valaszolt:'kikuldve',nem_reagal:'kikuldve',foglalt:'nyert',nem:'lezart',lejart:'lezart',kizart:'lezart'};
const TAG={review:'Review kell',tartalek:'Tartalék',valaszolt:'Válaszolt',nem_reagal:'Nem reagált',nem:'Nem kéri',lejart:'Lejárt',kizart:'Kizárt'};
const st=b=>ALIAS[b.allapot]||b.allapot;
function webUrl(b){const w=(b.weboldal||'').trim();if(!w)return '';return /^https?:\/\//i.test(w)?w:`https://${w}`}
const OPEN=new Set(JSON.parse(sessionStorage.getItem('vezerlo-nyitott')||'[]'));
document.addEventListener('toggle',e=>{const id=e.target.dataset?.shop;if(!id)return;e.target.open?OPEN.add(id):OPEN.delete(id);sessionStorage.setItem('vezerlo-nyitott',JSON.stringify([...OPEN]))},true);
const LEZART=new Set(['lezart']);
const KANBAN=Object.entries(S).map(([v,[label]])=>({label,states:new Set([v])}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ma=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Budapest'}).format(new Date());
const nap=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);const hu=d=>d?d.slice(5,10).replace('-','.')+'.':'';
const BACKUP_KEY='vezerlo-adat-backup-v1';let adat,linkek={},audit={demok:{}},view=localStorage.getItem('vezerlo-nezet')==='list'?'list':'kanban',openId=null,pendingBackup=null;
function ed(b,f){return `<input class="ed" type="text" maxlength="500" placeholder="—" aria-label="${f}" data-id="${esc(b.id)}" data-field="${f}" value="${esc(b[f]||'')}">`}
function badge(a){const[t,c]=S[a]||[a,'#888'];return `<span class="badge" style="background:${c}">${esc(t)}</span>`}
function options(selected){return Object.entries(S).map(([v,[label]])=>`<option value="${v}"${v===selected?' selected':''}>${esc(label)}</option>`).join('')}
function deadlineText(b){if(!b.hatarido)return 'nincs határidő';const d=nap(b.hatarido,ma);return d<0?`lejárt ${-d} napja`:d===0?'ma jár le':d===1?'holnap jár le':`${d} nap van hátra`}
function demoUrl(b){const slug=linkek[b.demo];return slug?`${location.origin}/${slug}/?bemutato=1`:''}
const UNNEP=new Set(['2026-10-23','2026-11-01','2026-12-24','2026-12-25','2026-12-26']);
function emailDeadline(b){if(b.kikuldve&&b.hatarido)return b.hatarido;const d=new Date(`${ma}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+3);while([0,6].includes(d.getUTCDay())||UNNEP.has(d.toISOString().slice(0,10)))d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function emailDeadlineHu(b){const text=new Intl.DateTimeFormat('hu-HU',{month:'long',day:'numeric',timeZone:'Europe/Budapest'}).format(new Date(`${emailDeadline(b)}T12:00:00Z`));return text.charAt(0).toLocaleUpperCase('hu')+text.slice(1)}
function emailContent(b,url){const deadline=emailDeadlineHu(b),shop=b.bolt;const items=[
`December 1–24. között a vásárlói, követői minden nap kinyitnak egy ablakot. Mögötte egy termék van a boltjából és egy kuponkód, ami csak aznap éjfélig él. Ez egy különleges kampány, amiért szívesen visszajönnek akár mindennap.`,
`Egy saját felületet kap, ahol Ön adja meg a napi terméket és kódot, szabadon tudja szerkeszteni bármikor. Például a december 20-i akciót elég 19-én felvinni.`,
`Javaslatom: váltogassa a %-os kedvezményt, az 1+1-et, az ajándékot/mintát a rendeléshez és az ingyenes szállítást vagy bármilyen ötletet. A 24. napon pedig hosszabb időre szóljon a kedvezmény, mondjuk január 10-ig.`,
`E-mail címeket is gyűjtünk, ezeket mind megkapja, hogy például hírlevél kampányokhoz használja később.`,
`A várhatóan nagyobb kosárérték és az e-mail címek mellett a márkájuk, webshopjuk hírneve is nőhet egy ilyen kreatív kampánnyal, amit megjegyeznek az emberek.`];
const plain=`Kedves ${shop}!\n\nElkészítettem az Önök digitális adventi kalendáriumát.\n\nItt ki tudja próbálni:\n${url}\n\nRöviden a lényeg:\n\n${items.map((x,i)=>`${i+1}. ${x}`).join('\n\n')}\n\nÁr: 100 000 Ft az idei adventre, vagy 160 000 Ft korlátlan, több éves használatra.\n\nKategóriánként csak egy webshopnak adom el.\n\n${deadline} estig várok a válaszára, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.\n\nHa szeretné használni, válaszoljon erre az e-mailre, és írja meg, mikor érne rá egy rövid telefonbeszélgetésre.\n\nOtt átbeszéljük az indulást és a kérdéseit.`;
const html=`<div><p>Kedves ${esc(shop)}!</p><p>Elkészítettem az Önök digitális adventi kalendáriumát.</p><p>Itt ki tudja próbálni:<br><a href="${esc(url)}">${esc(url)}</a></p><p><strong>Röviden a lényeg:</strong></p><ol>${items.map(x=>`<li><p>${esc(x)}</p></li>`).join('')}</ol><p><strong>Ár: 100 000 Ft az idei adventre, vagy 160 000 Ft korlátlan, több éves használatra.</strong></p><p><strong>Kategóriánként csak egy webshopnak adom el.</strong></p><p>${esc(deadline)} estig várok a válaszára, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.</p><p>Ha szeretné használni, válaszoljon erre az e-mailre, és írja meg, mikor érne rá egy rövid telefonbeszélgetésre.</p><p>Ott átbeszéljük az indulást és a kérdéseit.</p></div>`;return{plain,html}}
function reminderContent(b,url){const shop=b.bolt;const plain=`Kedves ${shop}!\n\nMa estig még a ${shop} számára tartom fenn az adventi kalendáriumot, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.\n\nItt újra megnézheti, telefonon is működik:\n${url}\n\nHa szeretné használni, elég egy rövid válasz, és egyeztetünk egy rövid telefonbeszélgetést.\nHa most nem aktuális, azt is megköszönöm, ha egy szóban jelzi.`;const html=`<div><p>Kedves ${esc(shop)}!</p><p>Ma estig még a ${esc(shop)} számára tartom fenn az adventi kalendáriumot, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.</p><p>Itt újra megnézheti, telefonon is működik:<br><a href="${esc(url)}">${esc(url)}</a></p><p>Ha szeretné használni, elég egy rövid válasz, és egyeztetünk egy rövid telefonbeszélgetést.<br>Ha most nem aktuális, azt is megköszönöm, ha egy szóban jelzi.</p></div>`;return{plain,html}}
function fallbackRichCopy(html){const box=document.createElement('div');box.contentEditable='true';box.style.cssText='position:fixed;left:-9999px;top:0';box.innerHTML=html;document.body.appendChild(box);const range=document.createRange(),selection=getSelection();range.selectNodeContents(box);selection.removeAllRanges();selection.addRange(range);const ok=document.execCommand('copy');selection.removeAllRanges();box.remove();if(!ok)throw new Error('A vágólap nem érhető el.')}
async function copyEmail(b,button,kind){const label=button.textContent,url=demoUrl(b),content=kind==='emlekezteto'?reminderContent(b,url):emailContent(b,url);let rich=false;try{if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([content.html],{type:'text/html'}),'text/plain':new Blob([content.plain],{type:'text/plain'})})]);rich=true}else{fallbackRichCopy(content.html);rich=true}}catch{try{fallbackRichCopy(content.html);rich=true}catch{}}if(rich){button.textContent='Kimásolva ✓';setTimeout(()=>button.textContent=label,1800);return}try{await navigator.clipboard.writeText(content.plain);button.textContent='Kimásolva (formázás nélkül)';setTimeout(()=>button.textContent=label,2200)}catch{const out=document.getElementById('save');out.className='save err';out.textContent='A vágólap nem érhető el.'}}
function urgency(b){const s=st(b),d=b.hatarido?nap(b.hatarido,ma):null;
if(s==='lezart')return{col:'lezart',rank:9,why:TAG[b.allapot]||'Lezárt',cls:'closed'};
if(s==='nyert')return{col:'nyert',rank:8,why:'Nyert',cls:'ok'};
if(b.allapot==='valaszolt')return{col:'most',rank:0,why:'Válaszolt → vidd tovább',cls:'urg'};
if(s==='idot_kert'){if(d===null)return{col:'ido',rank:3,why:'Időt kért → add meg, mikor kérdezz rá',cls:'warn'};if(d<0)return{col:'most',rank:1,why:`Időt kért, ${-d} napja lejárt → rákérdezés`,cls:'urg'};if(d===0)return{col:'most',rank:2,why:'Időt kért, ma kell rákérdezni',cls:'urg'};return{col:'ido',rank:3+d,why:`Rákérdezés: ${hu(b.hatarido)} (${d===1?'holnap':d+' nap múlva'})`,cls:d===1?'warn':''}}
if(s==='kikuldve'){if(d!==null&&d<0)return{col:'most',rank:1,why:`Lejárt ${-d} napja → utánkövetés vagy lezárás`,cls:'urg'};if(d===0)return{col:'most',rank:2,why:'Ma jár le → emlékeztető',cls:'urg'};return{col:'var',rank:3+(d??99),why:d===null?'Kiküldve, nincs határidő':d===1?'Holnap jár le':`${d} nap van hátra`,cls:d===1?'warn':''}}
if(s==='kuldheto'&&b.allapot!=='tartalek')return{col:'level',rank:4,why:'Mehet a levél',cls:''};
return{col:'keszul',rank:b.allapot==='tartalek'?6:5,why:TAG[b.allapot]||'Készül',cls:''}}
const BOARD=[['keszul','🛠 1. Készül / tartalék'],['level','✉️ 2. Mehet a levél'],['var','⏳ 3. Válaszra vár'],['ido','🕐 4. Időt kért'],['most','🔥 5. Most kell lépni'],['nyert','🏆 6. Nyert'],['lezart','Lezárt']];
const byUrg=(x,y)=>x[0].rank-y[0].rank||x[1].bolt.localeCompare(y[1].bolt,'hu');
function teendok(){const g={most:[],holnap:[],level:[]};for(const b of adat.boltok){const u=urgency(b);if(u.col==='most')g.most.push([u,b]);else if(u.col==='var'&&u.cls==='warn')g.holnap.push([u,b]);else if(u.col==='level')g.level.push([u,b])}
const chip=([u,b],short)=>`<button type="button" class="chip ${u.cls}" data-open="${esc(b.id)}">${esc(b.bolt)}${short?` <small>${esc(short(u))}</small>`:''}</button>`;
return[['🔥 Most kell lépni',g.most,u=>u.why.split(' →')[0].replace('Lejárt','lejárt').replace('Ma','ma').replace('Válaszolt','válaszolt')],['⏳ Holnap jár le',g.holnap,null],['✉️ Mehet a levél',g.level,null]].filter(x=>x[1].length).map(([t,items,short])=>`<div class="tg"><b>${t} (${items.length})</b>${items.sort(byUrg).map(x=>chip(x,short)).join('')}</div>`)}
function boardCard([u,b]){const miss=u.col==='level'&&!b.email&&!b.telefon?'<span class="kc-miss">e-mail/telefon hiányzik</span>':'';return `<button type="button" class="kanban-card ${u.cls}" data-open="${esc(b.id)}"><span class="kc-name">${esc(b.bolt)}</span><span class="kc-cat">${esc(b.kategoria||'')}</span><span class="kc-why ${u.cls}">${esc(u.why)}</span>${miss}</button>`}
function fillJump(){document.getElementById('boltlista').innerHTML=[...adat.boltok].sort((a,b)=>a.bolt.localeCompare(b.bolt,'hu')).map(b=>`<option value="${esc(b.bolt)}">${esc([b.kategoria,(b.weboldal||'').replace(/^https?:\/\//,'').replace(/\/$/,'')].filter(Boolean).join(' · '))}</option>`).join('')}
function findShop(q){q=(q||'').trim().toLocaleLowerCase('hu');if(!q)return null;const L=x=>String(x||'').toLocaleLowerCase('hu');return adat.boltok.find(b=>L(b.bolt)===q)||adat.boltok.find(b=>L(b.bolt).startsWith(q))||adat.boltok.find(b=>[b.bolt,b.weboldal,b.email,b.kinek,b.id].some(v=>L(v).includes(q)))}
function openShop(id){if(!adat.boltok.some(b=>b.id===id))return;openId=id;history.replaceState(null,'',`#${encodeURIComponent(id)}`);fillDrawer();const d=document.getElementById('drawer');if(!d.open)d.showModal()}
function fillDrawer(){const b=adat.boltok.find(x=>x.id===openId);if(!b)return;const u=urgency(b);document.getElementById('drawer-title').textContent=b.bolt;document.getElementById('drawer-body').innerHTML=`<div class="why ${u.cls}">${esc(u.why)}</div>${shopCard(b,true)}`;fitNotes(document.getElementById('drawer-body'))}
function closeShop(){openId=null;history.replaceState(null,'',location.pathname+location.search);document.getElementById('drawer-body').innerHTML='';const d=document.getElementById('drawer');if(d.open)d.close()}
function metrics(){const b=adat.boltok;return [['Készül',b.filter(x=>st(x)==='keszul').length],['Küldhető',b.filter(x=>st(x)==='kuldheto').length],['Kiküldve',b.filter(x=>st(x)==='kikuldve').length],['Időt kért',b.filter(x=>st(x)==='idot_kert').length],['Lejárt határidő',b.filter(x=>st(x)==='kikuldve'&&x.hatarido&&nap(x.hatarido,ma)<0).length],['Nyert',b.filter(x=>st(x)==='nyert').length]]}
function headerMeta(){const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null;document.getElementById('meta').innerHTML=`${adat.kategoriak.length} kategória · ${adat.boltok.length} ügyfél/jelölt · ${Object.keys(linkek).length} élő demó · frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírásig <b>${ah} nap</b>`:''}`}
function filtersHtml(){return `<section class="panel filters"><input id="kereses" type="search" placeholder="Keresés név, e-mail vagy kapcsolattartó alapján" value="${esc(localStorage.getItem('vezerlo-kereses')||'')}"><select id="kategoria-szuro"><option value="">Minden kategória</option>${adat.kategoriak.map(k=>`<option value="${esc(k.nev)}">${esc(k.nev)}</option>`).join('')}</select><select id="allapot-szuro"><option value="">Minden státusz</option>${Object.entries(S).map(([v,[l]])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></section>`}
function matches(b){const q=(document.getElementById('kereses')?.value||'').trim().toLocaleLowerCase('hu'),k=document.getElementById('kategoria-szuro')?.value||'',s=document.getElementById('allapot-szuro')?.value||'';const hay=[b.bolt,b.kategoria,b.kinek,b.email,b.telefon].join(' ').toLocaleLowerCase('hu');return(!q||hay.includes(q))&&(!k||b.kategoria===k)&&(!s||st(b)===s)}
const DRAFT={};
function noteTime(n){const f=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleString('hu-HU',{timeZone:'Europe/Budapest',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};return f(n.datum)+(n.modositva?` · szerkesztve ${f(n.modositva)}`:'')}
function notesHtml(b){const list=[...(Array.isArray(b.jegyzetek)?b.jegyzetek:[])].reverse();return `<div class="notes"><div class="notes-head">Megjegyzések${list.length?` (${list.length})`:''}</div><div class="note-new"><textarea data-new-note="${esc(b.id)}" maxlength="3000" rows="2" placeholder="Új megjegyzés… (⌘+Enter)" aria-label="Új megjegyzés">${esc(DRAFT[b.id]||'')}</textarea><button type="button" class="plain-button" data-add-note="${esc(b.id)}">+ Hozzáadás</button></div>${list.map(n=>`<div class="note"><div class="note-meta">${esc(noteTime(n))}</div><textarea class="note-text" rows="1" maxlength="3000" data-note-shop="${esc(b.id)}" data-note-id="${esc(n.id)}" aria-label="Megjegyzés ${esc(noteTime(n))}">${esc(n.szoveg)}</textarea></div>`).join('')}</div>`}
function fitNotes(root=document){root.querySelectorAll('.notes textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'})}
async function addNote(btn){const box=btn.closest('.notes'),ta=box?.querySelector('textarea[data-new-note]');if(!ta)return;const id=ta.dataset.newNote,t=ta.value.trim();if(!t){ta.focus();return}DRAFT[id]='';const ok=await save(id,{jegyzet_uj:t});if(!ok){DRAFT[id]=t;render()}fitNotes()}
function shopCard(b,inDrawer=false){const url=demoUrl(b),a=audit.demok?.[b.demo],missing=[];if(!b.kinek)missing.push('név pótolható');if(!b.email&&!b.telefon)missing.push('e-mail/telefon pótolható');if(b.demo&&!url)missing.push('nincs élő link');const web=webUrl(b),tag=TAG[b.allapot];return `<article class="shop${LEZART.has(st(b))?' done':''}"><div class="shop-top"><span class="name" title="${esc(b.bolt)}">${web?`<a class="shop-link" href="${esc(web)}" target="_blank" rel="noopener" title="Webshop megnyitása">${esc(b.bolt)} ↗</a>`:esc(b.bolt)}</span>${badge(st(b))}</div><div class="mini">${tag?`<span class="missing">${esc(tag)}</span>`:''}${url?'<span class="live">● élő demó</span>':b.demo?'<span>○ helyi demó</span>':'<span>nincs demó</span>'}${b.kikuldve?`<span>· kiküldve ${hu(b.kikuldve)}</span>`:''}${b.jegyzetek?.length?`<span class="note-count">· 📝 ${b.jegyzetek.length}</span>`:''}${b.hatarido?`<span class="${nap(b.hatarido,ma)<0?'urg':''}">· ${esc(deadlineText(b))}</span>`:''}${missing.map(x=>`<span class="missing">${esc(x)}</span>`).join('')}</div>${inDrawer?'<details class="info" open>':`<details class="info" data-shop="${esc(b.id)}"${OPEN.has(b.id)?' open':''}>`}<summary>Részletek és szerkesztés ▾</summary><dl class="dl"><dt>Kategória</dt><dd>${esc(b.kategoria)}</dd>${b.motivum?`<dt>Motívum</dt><dd>${esc(b.motivum)}</dd>`:''}<dt>Weboldal</dt><dd class="row email-row">${ed(b,'weboldal')}${web?`<a href="${esc(web)}" target="_blank" rel="noopener" title="Webshop megnyitása">↗</a>`:''}</dd><dt>Kinek</dt><dd>${ed(b,'kinek')}</dd><dt>E-mail</dt><dd class="row email-row">${ed(b,'email')}<button type="button" class="copy-addr" data-copy-addr="${esc(b.id)}" title="E-mail cím másolása">⧉</button>${b.email?`<a href="mailto:${esc(b.email)}" title="Levél írása">✉</a>`:''}</dd><dt>Telefon</dt><dd>${ed(b,'telefon')}</dd>${b.kapcsolat_minoseg?`<dt>Elérés</dt><dd>${esc(b.kapcsolat_minoseg)}</dd>`:''}${url?`<dt>Demó</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">Megnyitás</a> · <button class="plain-button" data-copy="${esc(url)}">Link másolása</button></dd><dt>Megkeresés</dt><dd><button class="plain-button" data-copy-email="${esc(b.id)}">E-mail másolása</button></dd><dt>Emlékeztető</dt><dd><button class="plain-button" data-copy-reminder="${esc(b.id)}" title="A határidő napján, válaszként az elküldött levélre">Emlékeztető másolása</button></dd>`:b.demo?`<dt>Demó</dt><dd>Helyben kész, még nincs élő link</dd>`:''}${a?`<dt>Forrás</dt><dd>${new Date(a.frissitve).toLocaleString('hu-HU')}</dd>`:''}<dt>Teendő</dt><dd>${ed(b,'teendo')}</dd><dt>Háttér</dt><dd>${ed(b,'megjegyzes')}</dd></dl>${notesHtml(b)}<div class="controls"><label class="control">Kiküldve<input type="date" data-id="${esc(b.id)}" data-field="kikuldve" value="${esc(b.kikuldve)}"></label><label class="control">${b.allapot==='idot_kert'?'Rákérdezés napja':'Határidő'}<input type="date" data-id="${esc(b.id)}" data-field="hatarido" value="${esc(b.hatarido)}"></label><label class="control">Státusz<select data-id="${esc(b.id)}" data-field="allapot">${options(st(b))}</select></label></div><div class="hint">Kattints egy értékre a szerkesztéshez; kilépéskor mentődik.</div></details></article>`}
function renderList(){const td=teendok(),showClosed=document.getElementById('lezart').checked;let h=`<div class="summary">${metrics().map(([l,n])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><section class="panel todo"><h2>Mai teendők <span class="meta">– kattints egy boltra a részletekért</span></h2>${td.length?td.join(''):'<div class="meta">Nincs sürgős teendő.</div>'}</section>${filtersHtml()}<div id="categories"></div>`;document.getElementById('app').innerHTML=h;document.getElementById('kategoria-szuro').value=localStorage.getItem('vezerlo-kategoria')||'';document.getElementById('allapot-szuro').value=localStorage.getItem('vezerlo-allapot')||'';renderCategories(showClosed)}
function renderCategories(showClosed=document.getElementById('lezart').checked){const root=document.getElementById('categories');if(!root)return;let h='';for(const k of adat.kategoriak){let shops=adat.boltok.filter(b=>b.kategoria===k.nev&&matches(b)&&(showClosed||!LEZART.has(st(b))));if(!shops.length&&(document.getElementById('kereses').value||document.getElementById('kategoria-szuro').value||document.getElementById('allapot-szuro').value))continue;h+=`<section class="cat"><div class="cat-head"><h2>${esc(k.nev)}</h2><span class="meta">${shops.length} ügyfél</span></div>${k.sor?`<div class="queue">Sorban: ${esc(k.sor)}</div>`:''}<div class="shop-grid">${shops.length?shops.map(shopCard).join(''):'<div class="empty">Még nincs rögzített ügyfél vagy demó ebben a kategóriában.</div>'}</div></section>`}root.innerHTML=h||'<section class="panel meta">Nincs találat a szűrésre.</section>'}
function renderKanban(){const filter=localStorage.getItem('vezerlo-kategoria')||'',showClosed=document.getElementById('lezart').checked,cols=BOARD.filter(([k])=>showClosed||k!=='lezart'),g=Object.fromEntries(BOARD.map(([k])=>[k,[]]));for(const b of adat.boltok){if(filter&&b.kategoria!==filter)continue;const u=urgency(b);g[u.col].push([u,b])}
let h=`<div class="summary">${metrics().map(([l,n])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><section class="panel filters"><select id="kategoria-szuro"><option value="">Minden kategória</option>${adat.kategoriak.map(k=>`<option value="${esc(k.nev)}">${esc(k.nev)}</option>`).join('')}</select></section><p class="kanban-note">Az oszlopok maguktól rendeződnek a státusz, a kiküldés és a határidő alapján; nem kell mozgatni. Kattints egy boltra a részletekért és a szerkesztéshez.</p><div class="kanban-wrap"><div class="kanban" style="--cols:${cols.length}">`;
for(const[k,label]of cols){const items=g[k].sort(byUrg);h+=`<section class="kanban-col col-${k}"><div class="kanban-head"><span>${label}</span><span class="count">${items.length}</span></div><div class="kanban-cards">${items.length?items.map(boardCard).join(''):'<div class="kanban-empty">Nincs itt semmi.</div>'}</div></section>`}
h+='</div></div>';document.getElementById('app').innerHTML=h;document.getElementById('kategoria-szuro').value=filter}
function render(){headerMeta();document.getElementById('list-view').classList.toggle('active',view==='list');document.getElementById('kanban-view').classList.toggle('active',view==='kanban');fillJump();view==='kanban'?renderKanban():renderList();if(openId)fillDrawer()}
function setView(next){view=next;localStorage.setItem('vezerlo-nezet',view);render()}
function tracked(data){return JSON.stringify((data?.boltok||[]).map(b=>[b.id,b.allapot,b.kikuldve||'',b.hatarido||'',b.teendo||'']))}
function backup(data){localStorage.setItem(BACKUP_KEY,JSON.stringify({mentve:new Date().toISOString(),adat:data}))}
function checkBackup(server){try{const saved=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');if(saved?.adat&&tracked(saved.adat)!==tracked(server)){pendingBackup=saved;document.getElementById('recovery').hidden=false}else backup(server)}catch{backup(server)}}
async function restoreBackup(){if(!pendingBackup)return;const out=document.getElementById('save'),button=document.getElementById('restore-backup');button.disabled=true;out.className='save saving';out.textContent='Helyi mentés visszaállítása…';try{for(const old of pendingBackup.adat.boltok||[]){const current=adat.boltok.find(b=>b.id===old.id);if(!current||tracked({boltok:[current]})===tracked({boltok:[old]}))continue;const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:old.id,allapot:old.allapot,kikuldve:old.kikuldve||'',hatarido:old.hatarido||'',teendo:old.teendo||''})});const j=await r.json();if(!r.ok)throw new Error(j.hiba||`Nem állítható vissza: ${old.bolt}`);adat=j}pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat);render();out.className='save saved';out.textContent='Helyi mentés visszaállítva ✓'}catch(e){out.className='save err';out.textContent=e.message}finally{button.disabled=false}}
async function save(id,changes){const out=document.getElementById('save');out.className='save saving';out.textContent='Mentés…';document.querySelectorAll('[data-field]').forEach(x=>x.disabled=true);try{const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...changes})});if(r.redirected){location.href='/belepes/';return}const j=await r.json();if(!r.ok)throw new Error(j.hiba||'Mentési hiba');adat=j;if(!pendingBackup)backup(adat);render();out.className='save saved';out.textContent='Mentve ✓';setTimeout(()=>out.textContent='',1800);return true}catch(e){out.className='save err';out.textContent=e.message;render();return false}finally{document.querySelectorAll('[data-field]').forEach(x=>x.disabled=false)}}
document.addEventListener('click',e=>{if(e.target.dataset?.addNote){addNote(e.target);return}const op=e.target.closest?.('[data-open]');if(op){openShop(op.dataset.open);return}if(e.target.id==='drawer-close'){closeShop();return}if(e.target.id==='drawer'){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){closeShop();return}}const ca=e.target.dataset?.copyAddr;if(ca){const v=e.target.parentElement.querySelector('input[data-field="email"]')?.value.trim();if(!v){e.target.textContent='üres';setTimeout(()=>e.target.textContent='⧉',1200);return}navigator.clipboard.writeText(v).then(()=>{e.target.textContent='✓';setTimeout(()=>e.target.textContent='⧉',1500)});return}const u=e.target.dataset?.copy,id=e.target.dataset?.copyEmail,rid=e.target.dataset?.copyReminder;if(rid){const b=adat.boltok.find(x=>x.id===rid);if(b)copyEmail(b,e.target,'emlekezteto');return}if(u)navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Másolva';setTimeout(()=>e.target.textContent='Link másolása',1500)});if(id){const b=adat.boltok.find(x=>x.id===id);if(b)copyEmail(b,e.target)}});
document.addEventListener('change',e=>{const nid=e.target.dataset?.noteId;if(nid){const v=e.target.value.trim();const b=adat.boltok.find(x=>x.id===e.target.dataset.noteShop),n=b?.jegyzetek?.find(x=>x.id===nid);if(!v){e.target.value=n?.szoveg||'';return}if(n&&n.szoveg!==v)save(b.id,{jegyzet:{id:nid,szoveg:v}});return}const{id,field}=e.target.dataset||{};if(id&&field)return save(id,{[field]:e.target.value});if(e.target.id==='kategoria-szuro'){localStorage.setItem('vezerlo-kategoria',e.target.value);view==='kanban'?renderKanban():renderCategories()}if(e.target.id==='allapot-szuro'){localStorage.setItem('vezerlo-allapot',e.target.value);renderCategories()}if(e.target.id==='lezart')render();if(e.target.id==='ugras'){const b=adat.boltok.find(x=>x.bolt===e.target.value);if(b){openShop(b.id);e.target.value=''}}});
document.addEventListener('input',e=>{if(e.target.dataset?.newNote!==undefined)DRAFT[e.target.dataset.newNote]=e.target.value;if(e.target.closest?.('.notes')&&e.target.tagName==='TEXTAREA'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+2+'px'}if(e.target.id==='kereses'){localStorage.setItem('vezerlo-kereses',e.target.value);renderCategories()}});
document.getElementById('drawer').addEventListener('close',()=>{if(openId)closeShop()});document.getElementById('ugras').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const b=findShop(e.target.value);const out=document.getElementById('save');if(b){openShop(b.id);e.target.value='';e.target.blur()}else{out.className='save err';out.textContent='Nincs ilyen bolt.';setTimeout(()=>out.textContent='',1800)}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.dataset?.newNote!==undefined){e.preventDefault();addNote(e.target);return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const j=document.getElementById('ugras');if(document.getElementById('drawer').open)closeShop();j.focus();j.select()}});
document.getElementById('list-view').addEventListener('click',()=>setView('list'));document.getElementById('kanban-view').addEventListener('click',()=>setView('kanban'));document.getElementById('logout').addEventListener('click',()=>{document.cookie='vezerlo=; Path=/; Max-Age=0';location.href='/belepes/'});document.getElementById('restore-backup').addEventListener('click',restoreBackup);document.getElementById('dismiss-backup').addEventListener('click',()=>{pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat)});
Promise.all([fetch('/api/vezerlo/adat',{cache:'no-store'}).then(r=>{if(!r.ok||r.redirected){location.href='/belepes/';throw new Error('Nincs belépve')}return r.json()}),fetch('kiadas.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:[]}).catch(()=>({demok:[]})),fetch('demo-audit.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:{}}).catch(()=>({demok:{}}))]).then(([a,k,d])=>{adat=a;audit=d;for(const x of k.demok)linkek[x.demo]=x.slug;checkBackup(adat);render();const h=decodeURIComponent(location.hash.slice(1));if(h)openShop(h)}).catch(e=>{document.getElementById('app').innerHTML=`<p class="err">Nem sikerült betölteni: ${esc(e.message)}</p>`});
</script>
<script>(function(){var b=document.getElementById("tema"),r=document.documentElement;function u(){var k=r.dataset.theme==="dark";b.textContent=k?"☀️ Nappali":"🌙 Éjszakai";b.setAttribute("aria-pressed",k)}b.addEventListener("click",function(){r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("vezerlo-tema",r.dataset.theme)}catch(e){}u()});u()})()</script>
