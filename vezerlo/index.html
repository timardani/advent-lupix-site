<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adventi vezérlő</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd6;--accent:#9b2c2c;--ok:#166534;--warn:#b45309;--blue:#1f4e8c}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header,main{max-width:1440px;margin:auto}header{padding:16px 14px 6px}main{padding:0 12px 40px}h1{margin:0;font-size:22px}.meta{color:var(--mut);font-size:12px;margin-top:3px}a{color:var(--blue)}button,input,select{font:inherit}
.tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.view-switch{display:flex;gap:3px;padding:3px;background:#e8e3da;border-radius:9px}.view-switch button,.plain-button{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#faf8f4;cursor:pointer}.view-switch button{border:0;background:transparent}.view-switch button.active{background:#fff;box-shadow:0 1px 3px #0002;font-weight:700}.save{min-height:18px}.saving{color:var(--warn)}.saved{color:var(--ok)}.err,.urg{color:var(--accent)}.urg{font-weight:700}
.summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px;margin:10px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px}.metric strong{display:block;font-size:21px;line-height:1.1}.metric span{color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin:9px 0}.panel h2{margin:0 0 7px;font-size:15px}.todo ul{margin:0;padding-left:18px}.todo li{margin:2px 0}
.filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(2,minmax(150px,1fr));gap:8px}.filters input,.filters select,.control input,.control select{width:100%;min-height:35px;padding:6px 8px;border:1px solid #cec6ba;border-radius:7px;background:#fff;color:var(--ink)}
.cat{margin:10px 0}.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 3px}.cat-head h2{font-size:15px;margin:0}.queue{color:var(--mut);font-size:11px;margin:2px 3px 7px}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:7px}.shop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}.shop.done{opacity:.62}.shop-top{display:flex;align-items:center;gap:6px;min-width:0}.name{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge,.flag{display:inline-block;border-radius:999px;padding:2px 7px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}.shop-top .badge{margin-left:auto}.mini{display:flex;gap:5px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:5px}.mini .missing{color:#9f1239;background:#fff1f2;border-radius:999px;padding:1px 6px}.mini .live{color:var(--ok)}
details.info{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}details.info>summary{cursor:pointer;color:var(--blue);font-size:12px;list-style:none}details.info>summary::-webkit-details-marker{display:none}.dl{display:grid;grid-template-columns:72px 1fr;gap:3px 7px;font-size:12px;margin:8px 0}.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:7px;padding-top:8px;border-top:1px solid var(--line)}.control{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:11px}.control.status,.control.task{grid-column:1/-1}.control.task input{font-size:12px}.hint{color:var(--mut);font-size:10px;margin-top:4px}
.empty{background:#ffffff80;border:1px dashed #d7d0c5;border-radius:9px;padding:9px;color:var(--mut);font-size:12px}.recovery{max-width:1416px;margin:7px auto;padding:10px 12px;background:#fff7ed;border:1px solid #f59e0b;border-radius:10px;color:#7c2d12}.recovery strong{display:block}.recovery button{margin:5px 5px 0 0}
.kanban-wrap{overflow-x:auto;padding-bottom:10px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:8px;min-width:940px;align-items:start}.kanban-col{background:#ebe7df;border:1px solid #ddd6ca;border-radius:11px;padding:8px;min-height:180px}.kanban-head{display:flex;justify-content:space-between;font-weight:700;padding:1px 2px 7px}.count{background:#fff;color:var(--mut);border-radius:999px;min-width:22px;text-align:center;font-size:11px;padding:1px 6px}.kanban-cards{display:flex;flex-direction:column;gap:5px}.kanban-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:700;font-size:13px;overflow-wrap:anywhere}.kanban-note{color:var(--mut);font-size:11px;margin:0 0 8px}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.shop-grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(5,82vw);min-width:calc(410vw + 32px)}.kanban-col{scroll-snap-align:start}.kanban-wrap{scroll-snap-type:x mandatory}.dl{grid-template-columns:1fr}.dl dt{margin-top:4px}}
</style>
</head>
<body>
<header>
 <h1>Adventi vezérlő</h1>
 <div class="meta" id="meta">Betöltés…</div>
 <div class="tools"><div class="view-switch" aria-label="Nézet"><button type="button" id="list-view">Lista</button><button type="button" id="kanban-view">Kanban</button></div><label id="lezart-wrap"><input type="checkbox" id="lezart"> Lezártak</label><span class="save" id="save" aria-live="polite"></span><button type="button" class="plain-button" id="logout">Kilépés</button></div>
</header>
<div class="recovery" id="recovery" hidden><strong>Korábbi helyi mentést találtam</strong>A szerver adatai eltérnek a böngészőben megőrzött példánytól. Ez redeploy utáni adatvesztés jele lehet.<br><button type="button" class="plain-button" id="restore-backup">Helyi mentés visszaállítása</button><button type="button" class="plain-button" id="dismiss-backup">A szerveradat megtartása</button></div>
<main id="app"></main>
<script>
const S={elokeszites:['Előkészítés','#8a8f98'],review:['Dani review-ra vár','#b7791f'],kuldheto:['Küldhető','#2b6cb0'],tartalek:['Tartalék','#64748b'],kikuldve:['Kiküldve','#6b46c1'],valaszolt:['Válaszolt','#0f766e'],foglalt:['Foglalt (igen)','#15803d'],nyert:['Nyert','#166534'],nem:['Nem kéri','#b91c1c'],nem_reagal:['Nem reagál','#9f1239'],lejart:['Lejárt','#9f1239'],kizart:['Kizárt','#475569']};
const LEZART=new Set(['nem','nem_reagal','lejart','kizart']);
const KANBAN=[{label:'Kész demo',states:new Set(['elokeszites','review','kuldheto','tartalek'])},{label:'Elküldve',states:new Set(['kikuldve'])},{label:'Második keresés',states:new Set(['nem_reagal','lejart'])},{label:'Érdekli',states:new Set(['valaszolt','foglalt','nyert'])},{label:'OFF',states:new Set(['nem','kizart'])}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ma=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Budapest'}).format(new Date());
const nap=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);const hu=d=>d?d.slice(5,10).replace('-','.')+'.':'';
const BACKUP_KEY='vezerlo-adat-backup-v1';let adat,linkek={},audit={demok:{}},view=localStorage.getItem('vezerlo-view')==='kanban'?'kanban':'list',pendingBackup=null;
function badge(a){const[t,c]=S[a]||[a,'#888'];return `<span class="badge" style="background:${c}">${esc(t)}</span>`}
function options(selected){return Object.entries(S).map(([v,[label]])=>`<option value="${v}"${v===selected?' selected':''}>${esc(label)}</option>`).join('')}
function deadlineText(b){if(!b.hatarido)return 'nincs határidő';const d=nap(b.hatarido,ma);return d<0?`lejárt ${-d} napja`:d===0?'ma jár le':d===1?'holnap jár le':`${d} nap van hátra`}
function demoUrl(b){const slug=linkek[b.demo];return slug?`${location.origin}/${slug}/?bemutato=1`:''}
function emailDeadline(b){if(b.hatarido)return b.hatarido;const d=new Date(`${ma}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+3);while([0,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function emailDeadlineHu(b){const text=new Intl.DateTimeFormat('hu-HU',{month:'long',day:'numeric',timeZone:'Europe/Budapest'}).format(new Date(`${emailDeadline(b)}T12:00:00Z`));return text.charAt(0).toLocaleUpperCase('hu')+text.slice(1)}
function emailContent(b,url){const deadline=emailDeadlineHu(b),shop=b.bolt;const items=[
`December 1–24. között a vásárlói, követői minden nap kinyitnak egy ablakot. Mögötte egy termék van a boltjából és egy kuponkód, ami csak aznap éjfélig él. Ez egy különleges kampány, amiért szívesen visszajönnek akár mindennap.`,
`Egy saját felületet kap, ahol Ön adja meg a napi terméket és kódot, szabadon tudja szerkeszteni bármikor. Például a december 20-i akciót elég 19-én felvinni.`,
`Javaslatom: váltogassa a %-os kedvezményt, az 1+1-et, az ajándékot/mintát a rendeléshez és az ingyenes szállítást vagy bármilyen ötletet. A 24. napon pedig hosszabb időre szóljon a kedvezmény, mondjuk január 10-ig.`,
`E-mail címeket is gyűjtünk, ezeket mind megkapja, hogy például hírlevél kampányokhoz használja később.`];
const plain=`Kedves ${shop}!\n\nElkészítettem az Önök digitális adventi kalendáriumát.\n\nItt ki tudja próbálni:\n${url}\n\nRöviden a lényeg:\n\n${items.map((x,i)=>`${i+1}. ${x}`).join('\n\n')}\n\nÁr: 100 000 Ft az idei adventre, vagy 160 000 Ft korlátlan, több éves használatra.\n\nKategóriánként csak egy webshopnak adom el.\n\n${deadline} estig várok a válaszára, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.\n\nHa szeretné használni, válaszoljon erre az e-mailre, és írja meg, mikor érne rá egy rövid telefonbeszélgetésre.\nOtt átbeszéljük az indulást és a kérdéseit.`;
const html=`<div><p>Kedves ${esc(shop)}!</p><p>Elkészítettem az Önök digitális adventi kalendáriumát.</p><p>Itt ki tudja próbálni:<br><a href="${esc(url)}">${esc(url)}</a></p><p><strong>Röviden a lényeg:</strong></p><ol>${items.map(x=>`<li><p>${esc(x)}</p></li>`).join('')}</ol><p><strong>Ár: 100 000 Ft az idei adventre, vagy 160 000 Ft korlátlan, több éves használatra.</strong></p><p><strong>Kategóriánként csak egy webshopnak adom el.</strong></p><p>${esc(deadline)} estig várok a válaszára, utána meg kell keresnem egy másik boltot, hogy a december 1-jei indulás biztos legyen.</p><p>Ha szeretné használni, válaszoljon erre az e-mailre, és írja meg, mikor érne rá egy rövid telefonbeszélgetésre.<br>Ott átbeszéljük az indulást és a kérdéseit.</p></div>`;return{plain,html}}
function fallbackRichCopy(html){const box=document.createElement('div');box.contentEditable='true';box.style.cssText='position:fixed;left:-9999px;top:0';box.innerHTML=html;document.body.appendChild(box);const range=document.createRange(),selection=getSelection();range.selectNodeContents(box);selection.removeAllRanges();selection.addRange(range);const ok=document.execCommand('copy');selection.removeAllRanges();box.remove();if(!ok)throw new Error('A vágólap nem érhető el.')}
async function copyEmail(b,button){const url=demoUrl(b),content=emailContent(b,url);let rich=false;try{if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([content.html],{type:'text/html'}),'text/plain':new Blob([content.plain],{type:'text/plain'})})]);rich=true}else{fallbackRichCopy(content.html);rich=true}}catch{try{fallbackRichCopy(content.html);rich=true}catch{}}if(rich){button.textContent='Kimásolva ✓';setTimeout(()=>button.textContent='E-mail másolása',1800);return}try{await navigator.clipboard.writeText(content.plain);button.textContent='Kimásolva (formázás nélkül)';setTimeout(()=>button.textContent='E-mail másolása',2200)}catch{const out=document.getElementById('save');out.className='save err';out.textContent='A vágólap nem érhető el.'}}
function teendok(){const t=[];for(const b of adat.boltok){const d=b.hatarido?nap(b.hatarido,ma):null;if(b.allapot==='kikuldve'&&d!==null&&d<0)t.push([0,`<span class="urg">${esc(b.bolt)}</span>: lejárt a határidő`]);else if(b.allapot==='kikuldve'&&d===0)t.push([1,`<span class="urg">${esc(b.bolt)}</span>: ma jár le`]);else if(b.allapot==='kikuldve'&&d===1)t.push([2,`${esc(b.bolt)}: holnap jár le`]);else if(b.allapot==='valaszolt')t.push([1,`${esc(b.bolt)}: válaszolt → vidd tovább`]);else if(b.allapot==='kuldheto')t.push([3,`${esc(b.bolt)}: mehet a levél`])}return t.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function metrics(){const b=adat.boltok;return [['Kiküldésre vár',b.filter(x=>x.allapot==='kuldheto').length],['Válaszra vár',b.filter(x=>x.allapot==='kikuldve').length],['Lejárt',b.filter(x=>['nem_reagal','lejart'].includes(x.allapot)||(x.allapot==='kikuldve'&&x.hatarido&&nap(x.hatarido,ma)<0)).length],['Érdekli / elkelt',b.filter(x=>['valaszolt','foglalt','nyert'].includes(x.allapot)).length]]}
function headerMeta(){const ah=adat.alairasi_hatarido?nap(adat.alairasi_hatarido,ma):null;document.getElementById('meta').innerHTML=`${adat.kategoriak.length} kategória · ${adat.boltok.length} ügyfél/jelölt · ${Object.keys(linkek).length} élő demó · frissítve: ${hu(adat.frissitve)}${ah!==null?` · aláírásig <b>${ah} nap</b>`:''}`}
function filtersHtml(){return `<section class="panel filters"><input id="kereses" type="search" placeholder="Keresés név, e-mail vagy kapcsolattartó alapján" value="${esc(localStorage.getItem('vezerlo-kereses')||'')}"><select id="kategoria-szuro"><option value="">Minden kategória</option>${adat.kategoriak.map(k=>`<option value="${esc(k.nev)}">${esc(k.nev)}</option>`).join('')}</select><select id="allapot-szuro"><option value="">Minden státusz</option>${Object.entries(S).map(([v,[l]])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></section>`}
function matches(b){const q=(document.getElementById('kereses')?.value||'').trim().toLocaleLowerCase('hu'),k=document.getElementById('kategoria-szuro')?.value||'',s=document.getElementById('allapot-szuro')?.value||'';const hay=[b.bolt,b.kategoria,b.kinek,b.email,b.telefon].join(' ').toLocaleLowerCase('hu');return(!q||hay.includes(q))&&(!k||b.kategoria===k)&&(!s||b.allapot===s)}
function shopCard(b){const url=demoUrl(b),a=audit.demok?.[b.demo],missing=[];if(!b.kinek)missing.push('nincs név');if(!b.email)missing.push('nincs e-mail');if(b.demo&&!url)missing.push('nincs élő link');return `<article class="shop${LEZART.has(b.allapot)?' done':''}"><div class="shop-top"><span class="name" title="${esc(b.bolt)}">${esc(b.bolt)}</span>${badge(b.allapot)}</div><div class="mini">${url?'<span class="live">● élő demó</span>':b.demo?'<span>○ helyi demó</span>':'<span>nincs demó</span>'}${b.kikuldve?`<span>· kiküldve ${hu(b.kikuldve)}</span>`:''}${b.hatarido?`<span class="${nap(b.hatarido,ma)<0?'urg':''}">· ${esc(deadlineText(b))}</span>`:''}${missing.map(x=>`<span class="missing">${esc(x)}</span>`).join('')}</div><details class="info"><summary>Részletek és szerkesztés ▾</summary><dl class="dl"><dt>Kategória</dt><dd>${esc(b.kategoria)}</dd><dt>Kinek</dt><dd>${esc(b.kinek||'—')}</dd><dt>E-mail</dt><dd>${b.email?`<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:'—'}</dd>${b.telefon?`<dt>Telefon</dt><dd>${esc(b.telefon)}</dd>`:''}${b.kapcsolat_minoseg?`<dt>Elérés</dt><dd>${esc(b.kapcsolat_minoseg)}</dd>`:''}${url?`<dt>Demó</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">Megnyitás</a> · <button class="plain-button" data-copy="${esc(url)}">Link másolása</button></dd><dt>Megkeresés</dt><dd><button class="plain-button" data-copy-email="${esc(b.id)}">E-mail másolása</button></dd>`:b.demo?`<dt>Demó</dt><dd>Helyben kész, még nincs élő link</dd>`:''}${a?`<dt>Forrás</dt><dd>${new Date(a.frissitve).toLocaleString('hu-HU')}</dd>`:''}${b.teendo?`<dt>Teendő</dt><dd>${esc(b.teendo)}</dd>`:''}${b.megjegyzes?`<dt>Megjegyzés</dt><dd>${esc(b.megjegyzes)}</dd>`:''}</dl><div class="controls"><label class="control">Kiküldés dátuma<input type="date" data-id="${esc(b.id)}" data-field="kikuldve" value="${esc(b.kikuldve)}"></label><label class="control">Határidő<input type="date" data-id="${esc(b.id)}" data-field="hatarido" value="${esc(b.hatarido)}"></label><label class="control status">Státusz<select data-id="${esc(b.id)}" data-field="allapot">${options(b.allapot)}</select></label><label class="control task">Következő teendő<input type="text" maxlength="500" data-id="${esc(b.id)}" data-field="teendo" value="${esc(b.teendo)}"></label></div><div class="hint">A kiküldési dátum módosításakor a 3 napos, hétvégét kerülő határidő automatikusan újraszámolódik.</div></details></article>`}
function renderList(){const td=teendok(),showClosed=document.getElementById('lezart').checked;let h=`<div class="summary">${metrics().map(([l,n])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><section class="panel todo"><h2>Mai teendők</h2>${td.length?`<ul>${td.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="meta">Nincs sürgős teendő.</div>'}</section>${filtersHtml()}<div id="categories"></div>`;document.getElementById('app').innerHTML=h;document.getElementById('kategoria-szuro').value=localStorage.getItem('vezerlo-kategoria')||'';document.getElementById('allapot-szuro').value=localStorage.getItem('vezerlo-allapot')||'';renderCategories(showClosed)}
function renderCategories(showClosed=document.getElementById('lezart').checked){const root=document.getElementById('categories');if(!root)return;let h='';for(const k of adat.kategoriak){let shops=adat.boltok.filter(b=>b.kategoria===k.nev&&matches(b)&&(showClosed||!LEZART.has(b.allapot)));if(!shops.length&&(document.getElementById('kereses').value||document.getElementById('kategoria-szuro').value||document.getElementById('allapot-szuro').value))continue;h+=`<section class="cat"><div class="cat-head"><h2>${esc(k.nev)}</h2><span class="meta">${shops.length} ügyfél</span></div>${k.sor?`<div class="queue">Sorban: ${esc(k.sor)}</div>`:''}<div class="shop-grid">${shops.length?shops.map(shopCard).join(''):'<div class="empty">Még nincs rögzített ügyfél vagy demó ebben a kategóriában.</div>'}</div></section>`}root.innerHTML=h||'<section class="panel meta">Nincs találat a szűrésre.</section>'}
function renderKanban(){const filter=localStorage.getItem('vezerlo-kategoria')||'';let h=`<div class="summary">${metrics().map(([l,n])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><section class="panel filters"><select id="kategoria-szuro"><option value="">Minden kategória</option>${adat.kategoriak.map(k=>`<option value="${esc(k.nev)}">${esc(k.nev)}</option>`).join('')}</select></section><p class="kanban-note">Áttekintő nézet: itt csak az ügyfélnevek látszanak, semmi nem szerkeszthető.</p><div class="kanban-wrap"><div class="kanban">`;for(const col of KANBAN){const shops=adat.boltok.filter(b=>col.states.has(b.allapot)&&(!filter||b.kategoria===filter));h+=`<section class="kanban-col"><div class="kanban-head"><span>${col.label}</span><span class="count">${shops.length}</span></div><div class="kanban-cards">${shops.map(b=>`<div class="kanban-card">${esc(b.bolt)}</div>`).join('')}</div></section>`}h+='</div></div>';document.getElementById('app').innerHTML=h;document.getElementById('kategoria-szuro').value=filter}
function render(){headerMeta();document.getElementById('list-view').classList.toggle('active',view==='list');document.getElementById('kanban-view').classList.toggle('active',view==='kanban');document.getElementById('lezart-wrap').hidden=view==='kanban';view==='kanban'?renderKanban():renderList()}
function setView(next){view=next;localStorage.setItem('vezerlo-view',view);render()}
function tracked(data){return JSON.stringify((data?.boltok||[]).map(b=>[b.id,b.allapot,b.kikuldve||'',b.hatarido||'',b.teendo||'']))}
function backup(data){localStorage.setItem(BACKUP_KEY,JSON.stringify({mentve:new Date().toISOString(),adat:data}))}
function checkBackup(server){try{const saved=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');if(saved?.adat&&tracked(saved.adat)!==tracked(server)){pendingBackup=saved;document.getElementById('recovery').hidden=false}else backup(server)}catch{backup(server)}}
async function restoreBackup(){if(!pendingBackup)return;const out=document.getElementById('save'),button=document.getElementById('restore-backup');button.disabled=true;out.className='save saving';out.textContent='Helyi mentés visszaállítása…';try{for(const old of pendingBackup.adat.boltok||[]){const current=adat.boltok.find(b=>b.id===old.id);if(!current||tracked({boltok:[current]})===tracked({boltok:[old]}))continue;const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:old.id,allapot:old.allapot,kikuldve:old.kikuldve||'',hatarido:old.hatarido||'',teendo:old.teendo||''})});const j=await r.json();if(!r.ok)throw new Error(j.hiba||`Nem állítható vissza: ${old.bolt}`);adat=j}pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat);render();out.className='save saved';out.textContent='Helyi mentés visszaállítva ✓'}catch(e){out.className='save err';out.textContent=e.message}finally{button.disabled=false}}
async function save(id,changes){const out=document.getElementById('save');out.className='save saving';out.textContent='Mentés…';document.querySelectorAll('[data-field]').forEach(x=>x.disabled=true);try{const r=await fetch('/api/vezerlo/adat',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...changes})});if(r.redirected){location.href='/belepes/';return}const j=await r.json();if(!r.ok)throw new Error(j.hiba||'Mentési hiba');adat=j;if(!pendingBackup)backup(adat);render();out.className='save saved';out.textContent='Mentve ✓';setTimeout(()=>out.textContent='',1800)}catch(e){out.className='save err';out.textContent=e.message;render()}finally{document.querySelectorAll('[data-field]').forEach(x=>x.disabled=false)}}
document.addEventListener('click',e=>{const u=e.target.dataset?.copy,id=e.target.dataset?.copyEmail;if(u)navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Másolva';setTimeout(()=>e.target.textContent='Link másolása',1500)});if(id){const b=adat.boltok.find(x=>x.id===id);if(b)copyEmail(b,e.target)}});
document.addEventListener('change',e=>{const{id,field}=e.target.dataset||{};if(id&&field)return save(id,{[field]:e.target.value});if(e.target.id==='kategoria-szuro'){localStorage.setItem('vezerlo-kategoria',e.target.value);view==='kanban'?renderKanban():renderCategories()}if(e.target.id==='allapot-szuro'){localStorage.setItem('vezerlo-allapot',e.target.value);renderCategories()}if(e.target.id==='lezart')renderList()});
document.addEventListener('input',e=>{if(e.target.id==='kereses'){localStorage.setItem('vezerlo-kereses',e.target.value);renderCategories()}});
document.getElementById('list-view').addEventListener('click',()=>setView('list'));document.getElementById('kanban-view').addEventListener('click',()=>setView('kanban'));document.getElementById('logout').addEventListener('click',()=>{document.cookie='vezerlo=; Path=/; Max-Age=0';location.href='/belepes/'});document.getElementById('restore-backup').addEventListener('click',restoreBackup);document.getElementById('dismiss-backup').addEventListener('click',()=>{pendingBackup=null;document.getElementById('recovery').hidden=true;backup(adat)});
Promise.all([fetch('/api/vezerlo/adat',{cache:'no-store'}).then(r=>{if(!r.ok||r.redirected){location.href='/belepes/';throw new Error('Nincs belépve')}return r.json()}),fetch('kiadas.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:[]}).catch(()=>({demok:[]})),fetch('demo-audit.json',{cache:'no-store'}).then(r=>r.ok?r.json():{demok:{}}).catch(()=>({demok:{}}))]).then(([a,k,d])=>{adat=a;audit=d;for(const x of k.demok)linkek[x.demo]=x.slug;checkBackup(adat);render()}).catch(e=>{document.getElementById('app').innerHTML=`<p class="err">Nem sikerült betölteni: ${esc(e.message)}</p>`});
</script>
</body>
</html>
