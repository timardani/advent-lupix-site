<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Adventi vezérlő – belépés</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1ea;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b2420}
form{background:#fff;padding:28px 24px;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.08);width:min(92vw,360px)}
h1{margin:0 0 16px;font-size:22px}input{width:100%;font-size:17px;padding:12px;border:1px solid #d8cfc3;border-radius:10px;margin:0 0 12px}
button{width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:#8b2e2e;color:#fff;font-weight:600}
.err{color:#b3261e;margin:0 0 12px;display:none}
</style></head><body>
<form id="f" autocomplete="on">
<h1>Adventi vezérlő</h1>
<p class="err" id="err">Hibás jelszó, próbáld újra.</p>
<input type="password" id="p" name="password" autocomplete="current-password" placeholder="Jelszó" required autofocus>
<button>Belépés</button>
</form>
<script>
if(document.cookie.split('; ').some(c=>c.startsWith('vezerlo='))) document.getElementById('err').style.display='block';
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();
 const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('advent-vezerlo:'+document.getElementById('p').value));
 const h=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
 document.cookie='vezerlo='+h+'; Path=/; Max-Age=5184000; Secure; SameSite=Strict';
 location.href='/vezerlo/';
});
</script></body></html>
